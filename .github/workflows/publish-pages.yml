name: Publish retained Pages site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: .
      - name: Deploy the uploaded artifact by ID
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return a valid artifact ID.');
            }
            // Use the upload output directly: the artifact listing service can
            // return an empty list immediately after a successful upload.
            const oidcToken = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: oidcToken
            });
            core.setOutput('page_url', deployment.page_url);
            const deploymentId = deployment.id || deployment.status_url.split('/').pop();
            const permanentErrors = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ]);
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data: state} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo, deployment_id: deploymentId
              });
              core.info(`Pages deployment ${deploymentId}: ${state.status}`);
              if (state.status === 'succeed') return;
              if (permanentErrors.has(state.status)) throw new Error(`Pages deployment: ${state.status}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              ...context.repo, deployment_id: deploymentId
            });
            throw new Error('Pages deployment timed out after ten minutes.');
